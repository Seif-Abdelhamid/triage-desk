# Local / self-hosted stack. Only the webhook port should ever be exposed publicly
# (behind TLS); the dashboard binds to localhost.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-triage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-triage}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-triage}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  migrate:
    build: ./backend
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    build: ./backend
    env_file: .env
    command: ["celery", "-A", "triage_desk.worker", "worker", "-Q", "scans", "--concurrency", "2", "--loglevel", "INFO"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  dashboard:
    build: ./dashboard
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [api]

volumes:
  pgdata:
